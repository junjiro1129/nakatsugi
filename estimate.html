<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積書ツール｜ナカツギ</title>
<style>
  :root{
    --ink:#16263F;--ink-soft:#3A4A63;--muted:#5C6675;--green:#137A57;--green-deep:#0C5A40;
    --paper:#F4F3ED;--surface:#FFFFFF;--line:rgba(22,38,63,.14);--line-soft:rgba(22,38,63,.07);
    --amber:#9A6B12;--amber-soft:rgba(154,107,18,.1);--blue:#2B5A9A;--blue-soft:#E1E9F5;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);
    line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}
  .ftr{margin-top:44px;border-top:1px solid var(--line);background:var(--surface)}
  .ftr-in{max-width:820px;margin:0 auto;padding:22px 20px 30px;text-align:center;
    color:var(--muted);font-size:12.5px;line-height:1.75}
  .ftr-t{font-size:11.5px;letter-spacing:.04em;margin-bottom:5px}
  .ftr-n{color:var(--ink);font-weight:700;font-size:13.5px}
  .ftr-c{margin-top:3px}
  .ftr-c a{color:var(--green-deep);font-weight:600;text-decoration:none}
  .ftr-c a:hover{text-decoration:underline}
  .ftr-c .sep{margin:0 6px;color:var(--line)}
  .ftr-s{margin-top:8px;font-size:11.5px}
  a{color:inherit}

  .top{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 0}
  .top .in{max-width:820px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px}
  .who{font-size:13px;color:var(--muted)}
  .who b{color:var(--ink)}

  h1{font-size:20px;margin:26px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
  .card h2{font-size:16px;margin:0 0 16px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .fld input,.fld textarea{width:100%;font-family:var(--sans);font-size:15px;padding:11px 13px;
    border:1.5px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
  .fld textarea{min-height:70px;resize:vertical}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--green)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .taxrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .taxrow label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;cursor:pointer}
  .taxrow input[type=number]{max-width:150px}
  .taxrow label input{width:auto;padding:0;margin:0}
  .preview{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}
  button{font-family:var(--sans);font-weight:700;cursor:pointer;border:none;border-radius:999px}
  .primary{background:var(--ink);color:#fff;font-size:15px;padding:12px 26px}
  .primary:hover{background:#0E1B30}
  .primary:disabled{opacity:.5;cursor:default}
  .sm{font-size:13px;font-weight:600;padding:7px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
  .sm:hover{border-color:var(--ink)}
  .sm.go{background:var(--green);color:#fff;border-color:var(--green)}
  .sm.del{color:#A3352B;border-color:rgba(163,53,43,.3)}
  .b-warn{background:rgba(163,53,43,.1);color:#A3352B}
  .grp{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:18px 0}
  .grp-h{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .grp-note{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:12px}
  .grp .fld:last-child{margin-bottom:0}
  .inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .inline input[type=number]{width:90px}
  .unit{font-size:14px;color:var(--muted)}
  .calc{font-size:13px;color:var(--green-deep);font-weight:600}
  .note-warn{margin-top:8px;padding:9px 12px;border-radius:8px;background:rgba(163,53,43,.07);
    color:#A3352B;font-size:12.5px;line-height:1.6}
  .sm.del:hover{background:rgba(163,53,43,.07);border-color:#A3352B}
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
  .listhead h2{font-size:16px;margin:0}
  .sm.go:hover{background:var(--green-deep)}

  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .est{border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-bottom:12px}
  .est .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .est .ti{font-weight:700;font-size:15px}
  .est .by{font-size:12.5px;color:var(--muted);margin-top:2px}
  .est .am{font-family:var(--mono);font-weight:700;font-size:16px;white-space:nowrap}
  .est .meta{font-size:12px;color:var(--muted);margin-top:6px}
  .est .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:8px}
  .b-open{background:var(--blue-soft);color:var(--blue)}
  .b-done{background:rgba(19,122,87,.12);color:var(--green-deep)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:#fff;font-size:14px;padding:12px 22px;border-radius:999px;transition:.25s;pointer-events:none;z-index:50}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:#A3352B}
  .gate{text-align:center;padding:70px 20px;color:var(--muted)}
  .gate .big{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:8px}
  .modes{display:flex;gap:8px;margin:24px 0 4px;flex-wrap:wrap}
  .mode{font-family:var(--sans);font-size:14px;font-weight:700;padding:9px 18px;border-radius:999px;
    border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer}
  .mode.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rules{background:var(--paper);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--ink-soft);line-height:1.75;margin:4px 0 16px}
  .rules b{color:var(--ink)}
  .b-pause{background:var(--amber-soft);color:var(--amber)}
  .b-end{background:var(--line-soft);color:var(--muted)}
  .pers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .per{font-size:11.5px;padding:3px 9px;border-radius:8px;background:var(--paper);color:var(--ink-soft)}
  .per.ok{background:rgba(19,122,87,.1);color:var(--green-deep)}
  .per.ng{background:rgba(163,53,43,.08);color:#A3352B}
  .chg{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
  .note-info{margin-top:8px;padding:9px 12px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-size:12.5px;line-height:1.6}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  @media(max-width:640px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 26 26"><circle cx="5" cy="13" r="3.4" fill="#16263F"/><circle cx="21" cy="13" r="3.4" fill="#16263F"/><path d="M5 13 Q13 1 21 13" fill="none" stroke="#137A57" stroke-width="2.4" stroke-linecap="round"/></svg>
    ナカツギ 見積書ツール
  </div>
  <div class="who" id="who"></div>
</div></div>

<div class="wrap" id="app"></div>

<footer class="ftr">
  <div class="ftr-in">
    <div class="ftr-t">ご不明な点・お困りの際はご連絡ください</div>
    <div class="ftr-n">ナカツギ 運営事務局（株式会社ナカホームズ）</div>
    <div class="ftr-c">
      <a href="mailto:jnaka@nakahomes.com">jnaka@nakahomes.com</a>
      <span class="sep">／</span>
      <a href="tel:082-548-9746">082-548-9746</a>
    </div>
    <div class="ftr-s">〒735-0025 広島県安芸郡府中町鹿籠2-14-25　登録番号：T7240001047118</div>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script>
  var WORKER_URL = "https://nakatsugi-stripe.junjiro1129.workers.dev";
  var p = new URLSearchParams(location.search);
  var SELLER = p.get("seller") || "";
  var app = document.getElementById("app");
  var bizName = "";

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function yen(n){ return "¥" + Number(n||0).toLocaleString("ja-JP"); }
  function ymd(s){ if(!s) return "—"; var d=new Date(s); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
  var tmo;
  function toast(m,err){ var t=$("toast"); t.textContent=m; t.className="toast on"+(err?" err":""); clearTimeout(tmo); tmo=setTimeout(function(){t.className="toast";},2600); }

  async function api(path, body, method){
    var opts={ method: method||"POST", headers:{"Content-Type":"application/json"} };
    if(body) opts.body=JSON.stringify(body);
    var res=await fetch(WORKER_URL.replace(/\/+$/,"")+path, opts);
    var d=await res.json();
    if(!res.ok) throw new Error(d.error||"エラーが発生しました");
    return d;
  }

  // 税・利用料の計算（表示用。Workerと同じ整数演算）
  var TAX_NUM=10,TAX_DEN=100;
  function bd(v,mode){ if(mode==="inc"){var ex=Math.round(v*TAX_DEN/(TAX_DEN+TAX_NUM));return{ex:ex,tax:v-ex,inc:v};}
    var t=Math.floor(v*TAX_NUM/TAX_DEN);return{ex:v,tax:t,inc:v+t}; }

  function gate(msg){
    app.innerHTML='<div class="gate"><div class="big">ご利用いただけません</div><div>'+esc(msg)+'</div></div>';
  }

  function docBase(){ return location.pathname.replace(/\/[^\/]*$/, "/doc.html"); }
  function estimateLink(id){ return location.origin + docBase() + "?id=" + encodeURIComponent(id) + "&kind=estimate"; }
  function quoteLink(qid){
    // 買い手が請書を見るページ。quote.html を同じ場所に置いている前提。
    return location.origin + location.pathname.replace(/\/[^\/]*$/, "/quote.html") + "?id=" + encodeURIComponent(qid);
  }

  function renderApp(){
    app.innerHTML =
      '<div class="modes"><button class="mode" data-mode="est">単発の取引（見積書・請書）</button>'+
        '<button class="mode" data-mode="con">月額の継続契約</button></div>'+
      '<div id="paneEst">'+
      '<h1>見積書をつくる</h1>'+
      '<p class="sub">お客さまへの提案用の見積書です。何枚でも自由に作れます。商談がまとまったら、そのまま「請書にする」で正式なご契約へ進めます。</p>'+
      '<div class="card"><h2>新しい見積書</h2>'+
        '<div class="fld"><label>お客さまの宛名</label><input id="f_buyer" placeholder="例：株式会社ミライ"></div>'+
        '<div class="fld"><label>件名</label><input id="f_title" placeholder="例：ロゴデザイン制作一式"></div>'+
        '<div class="fld"><label>内容の説明（任意）</label><input id="f_desc" placeholder="例：ロゴ3案・修正2回・データ納品"></div>'+
        '<div class="fld"><label>金額</label>'+
          '<div class="taxrow">'+
            '<input id="f_amount" type="number" placeholder="50000">'+
            '<label><input type="radio" name="tax" value="ex" checked> 税抜で入力</label>'+
            '<label><input type="radio" name="tax" value="inc"> 税込で入力</label>'+
          '</div>'+
          '<div class="preview" id="prev"></div>'+
        '</div>'+
        '<div class="grp">'+
          '<div class="grp-h">① この見積書について</div>'+
          '<div class="fld"><label>お客様がご承認いただける期限</label>'+
            '<div class="inline"><input id="f_days" type="number" value="14" min="1"><span class="unit">日間</span>'+
            '<span class="calc" id="f_days_calc"></span></div>'+
            '<div class="hint">この見積書を作成した日から数えます。見積書に「有効期限」として表示されます。</div></div>'+
        '</div>'+

        '<div class="grp">'+
          '<div class="grp-h">② 請書にしたときの取引条件</div>'+
          '<div class="grp-note">下記は、この見積書を「請書」に変換したときに、請書へ記載される条件です。見積書の段階では表示されません。</div>'+
          '<div class="fld"><label>役務提供の完了予定日</label><input id="f_due" type="date">'+
            '<div class="hint">いつまでに役務をお届けするかの予定日です。</div></div>'+
          '<div class="fld"><label>役務の提供を受ける場所</label><input id="f_place" list="placelist" placeholder="例：オンライン（データ納品）">'+
            '<datalist id="placelist"><option value="オンライン（データ納品）"><option value="役務利用者の指定場所"><option value="役務提供者の事業所"></datalist></div>'+
          '<div class="fld"><label>役務完了後、お客様が確認する期間</label>'+
            '<div class="inline"><select id="f_confirm"><option value="7">7日間</option><option value="10">10日間</option><option value="14">14日間</option></select></div>'+
            '<div class="hint">あなたが「役務の完了を申告」してから数えます。この期間内にお客様の確認も異議もない場合は、確認されたものとみなして自動でお支払いに進みます。</div></div>'+
        '</div>'+
        '<div class="fld"><label>備考（納期・条件など・任意）</label><textarea id="f_note" placeholder="例：納期はご発注から2週間／お支払いはご承認後の前払いとなります"></textarea></div>'+
        '<button class="primary" id="make">見積書を作成</button>'+
      '</div>'+
      '<div class="listhead"><h2>作成した見積書</h2><button class="sm" id="reload">再読み込み</button></div>'+
      '<div id="list"><div class="empty">読み込み中…</div></div>'+
      '</div>'+
      '<div id="paneCon" hidden>'+contractPaneHtml()+'</div>';

    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function(b){
      b.addEventListener("click", function(){ setMode(b.getAttribute("data-mode")); });
    });
    var m0 = "est"; try{ m0 = localStorage.getItem("nakatsugi_est_mode") || "est"; }catch(_){}
    setMode(m0);
    wireContractPane();

    $("f_amount").addEventListener("input", updPrev);
    $("f_days").addEventListener("input", updDays); updDays();
    Array.prototype.forEach.call(document.querySelectorAll('input[name=tax]'), function(r){ r.addEventListener("change", updPrev); });
    $("make").addEventListener("click", createEstimate);
    $("reload").addEventListener("click", function(){ $("reload").textContent="読み込み中…"; loadList().then(function(){ $("reload").textContent="再読み込み"; }); });
    loadList();
  }

  function updDays(){
    var n = parseInt($("f_days").value, 10);
    $("f_days_calc").textContent = (n > 0)
      ? "（" + ymd(new Date(Date.now() + n * 86400000).toISOString()) + " まで）" : "";
  }

  function updPrev(){
    var v=parseInt($("f_amount").value,10);
    if(!v||v<1){ $("prev").textContent=""; return; }
    var mode=(document.querySelector('input[name=tax]:checked')||{}).value||"ex";
    var t=bd(v,mode);
    $("prev").textContent="税抜 "+yen(t.ex)+" ＋ 消費税 "+yen(t.tax)+" ＝ 税込 "+yen(t.inc);
  }

  async function createEstimate(){
    var amount=parseInt($("f_amount").value,10);
    if(!amount||amount<1){ toast("金額を入力してください",true); return; }
    if(!$("f_title").value.trim()){ toast("件名を入力してください",true); return; }
    var btn=$("make"); btn.disabled=true; btn.textContent="作成中…";
    try{
      await api("/estimates/create", {
        seller: SELLER,
        buyer_name: $("f_buyer").value.trim(),
        title: $("f_title").value.trim(),
        description: $("f_desc").value.trim(),
        amount: amount,
        tax_mode: (document.querySelector('input[name=tax]:checked')||{}).value||"ex",
        valid_days: parseInt($("f_days").value,10)||14,
        delivery_due: $("f_due").value || "",
        delivery_place: $("f_place").value.trim(),
        confirm_days: parseInt($("f_confirm").value,10) || 7,
        note: $("f_note").value.trim(),
      });
      toast("見積書を作成しました");
      ["f_buyer","f_title","f_desc","f_amount","f_note"].forEach(function(i){ $(i).value=""; });
      $("prev").textContent="";
      loadList();
    }catch(e){ toast(e.message,true); }
    btn.disabled=false; btn.textContent="見積書を作成";
  }

  async function loadList(){
    try{
      var d=await api("/estimates/list?seller="+encodeURIComponent(SELLER), null, "GET");
      var list=$("list");
      if(!d.estimates.length){ list.innerHTML='<div class="empty">まだ見積書はありません。上のフォームから作成してください。</div>'; return; }
      list.innerHTML=d.estimates.map(renderEst).join("");
      // 配線
      Array.prototype.forEach.call(document.querySelectorAll("[data-copy-est]"),function(b){
        b.addEventListener("click",function(){ copy(estimateLink(b.getAttribute("data-copy-est")),"見積書リンクをコピーしました"); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-open-est]"),function(b){
        b.addEventListener("click",function(){ window.open(estimateLink(b.getAttribute("data-open-est")),"_blank"); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-convert]"),function(b){
        b.addEventListener("click",function(){ convert(b.getAttribute("data-convert"), b); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-copy-quote]"),function(b){
        b.addEventListener("click",function(){ copy(quoteLink(b.getAttribute("data-copy-quote")),"請書（買い手用）リンクをコピーしました"); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-statement]"),function(b){
        b.addEventListener("click",function(){ window.open(docBase()+"?id="+encodeURIComponent(b.getAttribute("data-statement"))+"&kind=statement","_blank"); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-delete]"),function(b){
        b.addEventListener("click",function(){ delEstimate(b.getAttribute("data-delete"), b); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-deliver]"),function(b){
        b.addEventListener("click",function(){ deliver(b.getAttribute("data-deliver"), b); });
      });
    }catch(e){ $("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  }

  var QSTATUS = {
    pending:        { label:"買い手の承認待ち", cls:"b-open" },
    awaiting_funds: { label:"入金待ち",        cls:"b-open" },
    paid:           { label:"役務提供中",      cls:"b-open" },
    released:       { label:"完了",            cls:"b-done" },
    refunded:       { label:"返金済み",        cls:"b-open" },
  };

  function renderEst(e){
    var done = !!e.converted_quote;
    var qs = e.quote_status || "";
    var statusBadge;
    if(!done){ statusBadge = '<span class="badge b-open">商談中</span>'; }
    else if(qs==="paid" && e.disputed){ statusBadge = '<span class="badge b-warn">お客様から確認のご連絡</span>'; }
    else if(qs==="paid" && e.delivered_at){ statusBadge = '<span class="badge b-open">お客様の確認待ち</span>'; }
    else if(QSTATUS[qs]){ statusBadge = '<span class="badge '+QSTATUS[qs].cls+'">'+QSTATUS[qs].label+'</span>'; }
    else { statusBadge = '<span class="badge b-done">請書にしました</span>'; }

    var h='<div class="est"><div class="r1"><div>'+
      '<div class="ti">'+esc(e.title)+statusBadge+'</div>'+
      '<div class="by">'+(e.buyer_name?esc(e.buyer_name)+' 様':'（宛名なし）')+'</div>'+
      '</div><div class="am">'+yen(e.amount_inc)+'</div></div>'+
      '<div class="meta">作成 '+ymd(e.created)+'　／　有効期限 '+ymd(e.valid_until)+
        (qs==="released"&&e.payout?'　／　お振込 '+yen(e.payout):'')+
        (qs==="paid"&&e.deemed_due&&!e.disputed?'　／　自動でお支払いに進む日 '+ymd(e.deemed_due):'')+'</div>'+
      (qs==="paid"&&e.disputed?'<div class="note-warn">お客様から内容の確認について連絡がありました。運営事務局よりご連絡いたします。</div>':'')+
      '<div class="acts">'+
        '<button class="sm" data-open-est="'+e.id+'">見積書を開く</button>'+
        '<button class="sm" data-copy-est="'+e.id+'">見積書リンクをコピー</button>';
    if(!done){
      h+='<button class="sm go" data-convert="'+e.id+'">この見積書を請書にする</button>';
      h+='<button class="sm del" data-delete="'+e.id+'">削除</button>';
    }else{
      h+='<button class="sm" data-copy-quote="'+e.converted_quote+'">請書リンクをコピー（買い手へ）</button>';
      // 支払い済みで未申告なら、役務完了を申告できる（確認期間のカウントが始まる）
      if(qs==="paid" && !e.delivered_at){
        h+='<button class="sm go" data-deliver="'+e.converted_quote+'">役務の完了を申告する</button>';
      }
      // 完了（送金済み）なら、出品者が自分で精算書を取得できる
      if(qs==="released"){
        h+='<button class="sm go" data-statement="'+e.converted_quote+'">精算書を取得</button>';
      }
    }
    h+='</div></div>';
    return h;
  }

  async function convert(id, btn){
    if(!confirm("この見積書を請書にします。\n請書は、買い手が承認すると契約成立・お支払いに進む正式な書類です。\nよろしいですか？")) return;
    btn.disabled=true; btn.textContent="作成中…";
    try{
      var d=await api("/estimates/convert", { seller: SELLER, id: id });
      toast(d.already?"すでに請書にしています":"請書を作成しました");
      loadList();
    }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent="この見積書を請書にする"; }
  }

  async function deliver(qid, btn){
    if(!confirm("役務の提供が完了したことをお客様に申告します。\n\n・お客様が確認するか、確認期間が過ぎると、お支払いに進みます。\n・申告の前に、お客様へ完了のご連絡をお願いします。\n\nよろしいですか？")) return;
    btn.disabled=true; btn.textContent="送信中…";
    try{
      var d=await api("/quotes/deliver", { seller: SELLER, id: qid });
      toast(d.already?"すでに申告済みです":"完了を申告しました。お客様の確認をお待ちください。");
      loadList();
    }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent="役務の完了を申告する"; }
  }

  async function delEstimate(id, btn){
    if(!confirm("この見積書を削除します。\nこの操作は取り消せません。よろしいですか？")) return;
    btn.disabled=true; btn.textContent="削除中…";
    try{
      await api("/estimates/delete", { seller: SELLER, id: id });
      toast("見積書を削除しました");
      loadList();
    }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent="削除"; }
  }

  async function copy(text,msg){
    try{ await navigator.clipboard.writeText(text); toast(msg); }
    catch(_){ prompt("以下をコピーしてください：", text); }
  }

  // ===== 月額の継続契約 =====
  function setMode(m){
    if(m!=="con") m="est";
    $("paneEst").hidden = (m!=="est"); $("paneCon").hidden = (m!=="con");
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function(b){
      b.className = "mode" + (b.getAttribute("data-mode")===m ? " on" : "");
    });
    try{ localStorage.setItem("nakatsugi_est_mode", m); }catch(_){}
    if(m==="con" && !conLoaded){ loadContracts(); }
  }
  var conLoaded = false, contracts = [];

  function contractLink(c){
    return location.origin + location.pathname.replace(/\/[^\/]*$/, "/contract.html") +
      "?id=" + encodeURIComponent(c.id) + "&k=" + encodeURIComponent(c.buyer_key || "");
  }
  function ymL(ym){ if(!ym) return ""; var a=ym.split("-"); return a[0]+"年"+Number(a[1])+"月"; }
  function nowYm(){ var d=new Date(); return d.getFullYear()+"年"+(d.getMonth()+1)+"月"; }

  function contractPaneHtml(){
    return '<h1>月額の継続契約をつくる</h1>'+
      '<p class="sub">保守・運用・定期的な制作など、毎月同じ金額で続くお仕事向けです。毎月1日に、その月分の請書が自動で発行されます。</p>'+
      '<div class="card"><h2>新しい継続契約</h2>'+
        '<div class="rules">'+
          '<b>ご請求</b>：毎月1日に、その月分の請書を発行します。月の途中から始めても<b>初月は1か月分</b>です（日割りなし）。初月分の請書は作成と同時に発行されます。<br>'+
          '<b>更新</b>：1か月ごとに自動で更新します。<br>'+
          '<b>完了の申告</b>：毎月末日に自動で申告したものとします。確認期間のあと、自動でお支払いに進みます。<br>'+
          '<b>未払い</b>：請書の発行から14日で停止（その間の役務提供は不要）、60日で契約終了です。<br>'+
          '<b>解約</b>：双方とも、申出から30日を経過する日の属する月の末日で終了。支払い済みの月の返金はありません。<br>'+
          '<b>条件の変更</b>：あなたが提案し、お客様が同意すると、今月末で切り替わります。'+
        '</div>'+
        '<div class="fld"><label>お客さまの宛名</label><input id="k_buyer" placeholder="例：株式会社ミライ"></div>'+
        '<div class="fld"><label>契約の内容（件名）</label><input id="k_title" placeholder="例：Webサイト保守・運用"></div>'+
        '<div class="fld"><label>内容の説明（任意）</label><input id="k_desc" placeholder="例：月2回までの更新作業・月次レポート"></div>'+
        '<div class="fld"><label>月額</label>'+
          '<div class="taxrow">'+
            '<input id="k_amount" type="number" placeholder="30000">'+
            '<label><input type="radio" name="ktax" value="ex" checked> 税抜で入力</label>'+
            '<label><input type="radio" name="ktax" value="inc"> 税込で入力</label>'+
          '</div><div class="preview" id="k_prev"></div></div>'+
        '<div class="row2">'+
          '<div class="fld"><label>役務の提供を受ける場所</label><input id="k_place" list="placelist" placeholder="例：オンライン（データ納品）"></div>'+
          '<div class="fld"><label>毎月の完了後、お客様が確認する期間</label>'+
            '<select id="k_confirm"><option value="7">7日間</option><option value="10">10日間</option><option value="14">14日間</option></select>'+
            '<div class="hint">月末日から数えます。</div></div>'+
        '</div>'+
        '<button class="primary" id="k_make">継続契約を作成（初月：'+nowYm()+'分）</button>'+
      '</div>'+
      '<div class="listhead"><h2>継続契約</h2><button class="sm" id="k_reload">再読み込み</button></div>'+
      '<div id="k_list"><div class="empty">読み込み中…</div></div>';
  }

  function wireContractPane(){
    $("k_amount").addEventListener("input", updKPrev);
    Array.prototype.forEach.call(document.querySelectorAll('input[name=ktax]'), function(r){ r.addEventListener("change", updKPrev); });
    $("k_make").addEventListener("click", createContract);
    $("k_reload").addEventListener("click", function(){ $("k_reload").textContent="読み込み中…"; loadContracts().then(function(){ $("k_reload").textContent="再読み込み"; }); });
    $("k_list").addEventListener("click", onContractClick);
  }

  function updKPrev(){
    var v=parseInt($("k_amount").value,10);
    if(!v||v<1){ $("k_prev").textContent=""; return; }
    var mode=(document.querySelector('input[name=ktax]:checked')||{}).value||"ex";
    var t=bd(v,mode);
    $("k_prev").textContent="毎月：税抜 "+yen(t.ex)+" ＋ 消費税 "+yen(t.tax)+" ＝ 税込 "+yen(t.inc);
  }

  async function createContract(){
    var amount=parseInt($("k_amount").value,10);
    if(!amount||amount<1){ toast("月額を入力してください",true); return; }
    if(!$("k_title").value.trim()){ toast("契約の内容（件名）を入力してください",true); return; }
    if(!confirm("継続契約を作成します。\n\n・初月（"+nowYm()+"）分の請書も同時に発行されます。月の途中でも1か月分です。\n・お客様が初月分を承認して支払うと、契約が始まります。\n\nよろしいですか？")) return;
    var btn=$("k_make"); btn.disabled=true; btn.textContent="作成中…";
    try{
      var d = await api("/contracts/create", {
        seller: SELLER,
        buyer_name: $("k_buyer").value.trim(),
        title: $("k_title").value.trim(),
        description: $("k_desc").value.trim(),
        amount: amount,
        tax_mode: (document.querySelector('input[name=ktax]:checked')||{}).value||"ex",
        delivery_place: $("k_place").value.trim(),
        confirm_days: parseInt($("k_confirm").value,10)||7,
      });
      ["k_buyer","k_title","k_desc","k_amount"].forEach(function(i){ $(i).value=""; });
      $("k_prev").textContent="";
      await copy(contractLink({ id:d.id, buyer_key:d.buyer_key }), "継続契約を作成し、お客様用の契約ページのリンクをコピーしました");
      loadContracts();
    }catch(e){ toast(e.message,true); }
    btn.disabled=false; btn.textContent="継続契約を作成（初月："+nowYm()+"分）";
  }

  var KST = {
    pending:        { label:"初月のお支払い待ち", cls:"b-open" },
    scheduled:      { label:"開始待ち（条件変更）", cls:"b-open" },
    active:         { label:"契約中",            cls:"b-done" },
    paused_unpaid:  { label:"停止中（未払い）",  cls:"b-pause" },
    paused_dispute: { label:"停止中（お客様から確認のご連絡）", cls:"b-pause" },
    ended:          { label:"終了",              cls:"b-end" },
  };
  var KPST = { pending:"未払い", awaiting_funds:"入金待ち", paid:"提供中", released:"完了", refunded:"返金", void:"失効" };

  async function loadContracts(){
    try{
      var d = await api("/contracts/list?seller="+encodeURIComponent(SELLER), null, "GET");
      contracts = d.contracts || []; conLoaded = true;
      var el = $("k_list");
      if(!contracts.length){ el.innerHTML='<div class="empty">まだ継続契約はありません。上のフォームから作成してください。</div>'; return; }
      el.innerHTML = contracts.map(renderContract).join("");
    }catch(e){ $("k_list").innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
  }

  function renderContract(c){
    var st = KST[c.status] || { label:c.status, cls:"b-end" };
    var h = '<div class="est"><div class="r1"><div>'+
      '<div class="ti">'+esc(c.title)+'<span class="badge '+st.cls+'">'+st.label+'</span></div>'+
      '<div class="by">'+(c.buyer_name?esc(c.buyer_name)+' 様':'（宛名なし）')+'</div></div>'+
      '<div class="am">'+yen(c.amount_inc)+'<span class="unit"> /月</span></div></div>'+
      '<div class="meta">開始 '+ymL(c.start_month)+'　／　確認期間 '+c.confirm_days+'日'+
        (c.cancel && c.cancel.end_month ? '　／　<b>'+ymL(c.cancel.end_month)+'末で終了予定</b>（'+(c.cancel.by==="buyer"?"お客様から解約":c.cancel.by==="seller"?"あなたから解約":"条件変更")+'）' : '')+'</div>';
    if(c.status==="paused_dispute") h += '<div class="note-warn">お客様から内容の確認について連絡がありました。翌月以降の請書の発行を止めています。運営事務局よりご連絡いたします。</div>';
    if(c.status==="paused_unpaid") h += '<div class="note-warn">お客様のお支払いが確認できないため停止中です。その間、役務を提供する必要はありません。請書の発行から60日で契約は終了します。</div>';
    if(c.replaced_by) h += '<div class="note-info">条件変更により、新しい継続契約に切り替わりました（下の一覧に表示されています）。</div>';
    if(c.change && c.change.status==="proposed") h += '<div class="note-info">条件変更を提案中：「'+esc(c.change.title)+'」 月額 '+yen(c.change.amount_inc)+'（税込）。お客様が契約ページで同意すると、今月末で切り替わります。</div>';

    if(c.periods && c.periods.length){
      h += '<div class="pers">'+c.periods.slice(-6).map(function(p){
        var cls = p.status==="released" ? " ok" : ((p.status==="void"||p.disputed) ? " ng" : "");
        return '<span class="per'+cls+'">'+ymL(p.month).replace(/^\d+年/,"")+' '+(p.disputed?"確認中":(KPST[p.status]||p.status))+'</span>';
      }).join("")+'</div>';
    }

    h += '<div class="acts">';
    if(c.status!=="ended") h += '<button class="sm go" data-k-link="'+c.id+'">契約ページのリンクをコピー（お客様へ）</button>';
    if(c.due_quote) h += '<button class="sm" data-k-due="'+c.due_quote.quote_id+'">'+esc(c.due_quote.label)+'の請書リンクをコピー</button>';
    (c.periods||[]).filter(function(p){ return p.status==="released"; }).slice(-3).forEach(function(p){
      h += '<button class="sm" data-k-stm="'+p.quote_id+'">'+ymL(p.month).replace(/^\d+年/,"")+'分の精算書</button>';
    });
    if(c.status==="active" && !c.cancel && !(c.change && c.change.status==="proposed")) h += '<button class="sm" data-k-chg="'+c.id+'">条件の変更を提案</button>';
    if(c.change && c.change.status==="proposed") h += '<button class="sm" data-k-wd="'+c.id+'">変更の提案を取り下げる</button>';
    if(c.status!=="ended" && c.status!=="scheduled" && !c.cancel) h += '<button class="sm del" data-k-cancel="'+c.id+'">解約を申し出る</button>';
    h += '</div><div id="chg_'+c.id+'"></div></div>';
    return h;
  }

  function findC(id){ for(var i=0;i<contracts.length;i++){ if(contracts[i].id===id) return contracts[i]; } return null; }

  async function onContractClick(e){
    var b = e.target.closest("button"); if(!b) return;
    var a;
    if((a=b.getAttribute("data-k-link"))){ copy(contractLink(findC(a)), "お客様用の契約ページのリンクをコピーしました"); return; }
    if((a=b.getAttribute("data-k-due"))){ copy(quoteLink(a), "今月分の請書リンクをコピーしました"); return; }
    if((a=b.getAttribute("data-k-stm"))){ window.open(docBase()+"?id="+encodeURIComponent(a)+"&kind=statement","_blank"); return; }
    if((a=b.getAttribute("data-k-chg"))){ showChangeForm(findC(a)); return; }
    if((a=b.getAttribute("data-k-chgsend"))){ sendChange(a, b); return; }
    if((a=b.getAttribute("data-k-wd"))){
      if(!confirm("条件変更の提案を取り下げます。よろしいですか？")) return;
      b.disabled=true;
      try{ await api("/contracts/change", { seller: SELLER, id: a, withdraw: true }); toast("提案を取り下げました"); loadContracts(); }
      catch(err){ toast(err.message,true); b.disabled=false; }
      return;
    }
    if((a=b.getAttribute("data-k-cancel"))){
      var c = findC(a);
      var msg = c.status==="pending"
        ? "この継続契約を解約します。初月のお支払い前のため、すぐに終了します。\nよろしいですか？"
        : "この継続契約の解約を申し出ます。\n申出から30日を経過する日の属する月の末日で終了します。それまでの月は通常どおり請求され、役務の提供も続きます。\n\nよろしいですか？";
      if(!confirm(msg)) return;
      b.disabled=true;
      try{ await api("/contracts/cancel", { seller: SELLER, id: a }); toast("解約を申し出ました"); loadContracts(); }
      catch(err){ toast(err.message,true); b.disabled=false; }
    }
  }

  function showChangeForm(c){
    var box = $("chg_"+c.id);
    if(box.innerHTML){ box.innerHTML=""; return; }
    box.innerHTML = '<div class="chg">'+
      '<div class="grp-h">変更後の条件</div>'+
      '<div class="grp-note">お客様が契約ページで同意すると、今月末で現在の契約を終え、翌月1日から変更後の条件で継続します（予告期間なし）。</div>'+
      '<div class="fld"><label>契約の内容（件名）</label><input id="cg_title_'+c.id+'" value="'+esc(c.title)+'"></div>'+
      '<div class="fld"><label>内容の説明（任意）</label><input id="cg_desc_'+c.id+'" value="'+esc(c.description||"")+'"></div>'+
      '<div class="fld"><label>変更後の月額</label><div class="taxrow">'+
        '<input id="cg_amt_'+c.id+'" type="number" value="'+c.amount_ex+'">'+
        '<label><input type="radio" name="cgtax_'+c.id+'" value="ex" checked> 税抜</label>'+
        '<label><input type="radio" name="cgtax_'+c.id+'" value="inc"> 税込</label></div></div>'+
      '<button class="sm go" data-k-chgsend="'+c.id+'">この条件で変更を提案する</button></div>';
  }

  async function sendChange(id, btn){
    var amt = parseInt($("cg_amt_"+id).value,10);
    if(!amt||amt<1){ toast("月額を入力してください",true); return; }
    btn.disabled=true; btn.textContent="送信中…";
    try{
      await api("/contracts/change", {
        seller: SELLER, id: id, amount: amt,
        tax_mode: (document.querySelector('input[name=cgtax_'+id+']:checked')||{}).value||"ex",
        title: $("cg_title_"+id).value.trim(), description: $("cg_desc_"+id).value.trim(),
      });
      toast("変更を提案しました。お客様に契約ページの確認をお願いしてください。");
      loadContracts();
    }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent="この条件で変更を提案する"; }
  }

  // 起動：est_トークンを検証して屋号を取得
  (async function(){
    if(!SELLER){ gate("見積書ツールのリンクが正しくありません。運営からお送りしたURLをご確認ください。"); return; }
    try{
      var me=await api("/estimates/me?seller="+encodeURIComponent(SELLER), null, "GET");
      bizName=me.business_name||"";
      $("who").innerHTML = bizName ? '<b>'+esc(bizName)+'</b> 様' : '';
      renderApp();
    }catch(e){ gate(e.message); }
  })();
</script>
</body>
</html>
